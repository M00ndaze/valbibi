<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      background: #d4f7d4; /* Soft green background */
      color: #4a4a4a;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    /* Fur tufts around the edges */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('fur-tufts.png') repeat;
      pointer-events: none;
      opacity: 0.3;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #4a4a4a;
    }
    p {
      font-size: 1.5rem;
      margin-bottom: 30px;
      color: #4a4a4a;
    }
    .button-container {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    #yesButton {
      padding: 15px 30px;
      font-size: 1.2rem;
      background: #6fcf97; /* Green button */
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #noButton {
      padding: 15px 30px;
      font-size: 1.2rem;
      background: #ff6f61; /* Red button */
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: static; /* Fix for disappearing button */
      transition: transform 0.2s, opacity 0.2s;
    }
    #dinoImage {
      width: 150px;
      margin-bottom: 20px;
      animation: float 3s infinite ease-in-out;
    }
    #peekingDino {
      width: 100px;
      position: absolute;
      bottom: -100px; /* Start hidden below the screen */
      left: 50%;
      transform: translateX(-50%);
      transition: bottom 0.5s ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .speech-bubble {
      position: relative;
      background: white;
      color: #4a4a4a;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 1.2rem;
      max-width: 300px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: white transparent transparent;
    }
    /* Confetti container */
    #confetti {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #6fcf97; /* Green confetti */
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      animation: confetti-fall 2s linear infinite;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <img id="dinoImage" src="fluffy-dino.png" alt="Fluffy Dino">
  <div class="speech-bubble">
    IT me, HABIBI! 🦖<br><br>
    Daddy pwomise I will get angpao if I ask<br><br>
    Will you bee his ventine? pwease pwease pwease 💖
  </div>
  <div class="button-container">
    <button id="yesButton">Yes</button>
    <button id="noButton">No</button>
  </div>
  <img id="peekingDino" src="fluffy-dino-peek.png" alt="Fluffy Dino Peeking">
  <div id="confetti"></div>
  <script>
    const yesButton = document.getElementById('yesButton');
    const noButton = document.getElementById('noButton');
    const dinoImage = document.getElementById('dinoImage');
    const peekingDino = document.getElementById('peekingDino');
    const confettiContainer = document.getElementById('confetti');

    let yesButtonSize = 1;
    let noButtonSize = 1;

    noButton.addEventListener('mouseover', () => {
      // Move the "No" button randomly
      const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
      const y = Math.random() * (window.innerHeight - noButton.offsetHeight);
      noButton.style.position = 'absolute';
      noButton.style.left = `${x}px`;
      noButton.style.top = `${y}px`;

      // Decrease the size of the "No" button
      noButtonSize *= 0.8; // Reduce size by 20% each time
      noButton.style.transform = `scale(${noButtonSize})`;

      // Increase the size of the "Yes" button
      yesButtonSize += 0.2;
      yesButton.style.transform = `scale(${yesButtonSize})`;

      // If the "No" button is too small, hide it and show the peeking dino
      if (noButtonSize < 0.3) {
        noButton.style.display = 'none';
        peekingDino.style.bottom = '20px'; // Make the dino peek up
      }
    });

    yesButton.addEventListener('click', () => {
      // Show a cute message
      alert("YAYAYAYY! PWEASE ASK HOJI FOR ME TOO THANKY! 🦖💕");

      // Trigger confetti
      createConfetti();

      // Make the dino dance
      dinoImage.style.animation = 'float 0.5s infinite ease-in-out';
    });

    function createConfetti() {
      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti-piece');
        confetti.style.left = `${Math.random() * 100}vw`;
        confetti.style.animationDuration = `${Math.random() * 2 + 1}s`;
        confetti.style.opacity = Math.random();
        confettiContainer.appendChild(confetti);

        // Remove confetti after animation ends
        setTimeout(() => {
          confetti.remove();
        }, 3000);
      }
    }
  </script>
</body>
</html>
